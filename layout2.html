<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestion des Congés Administratifs</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<style>
body {
    background-color: #f4f6f9;
}

.sidebar {
    height: 100vh;
    background: #0d6efd;
    color: white;
}

.sidebar a {
    color: white;
    text-decoration: none;
    display: block;
    padding: 12px;
}

.sidebar a:hover {
    background: rgba(255,255,255,0.2);
}

.content {
    padding: 30px;
}

.card-custom {
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}
</style>
</head>
<body>

<div class="container-fluid">
<div class="row">

<!-- Sidebar -->
<div class="col-md-2 sidebar p-3">
    <h4>Administratif</h4>
    <hr>
    <a href="dashboard.html"><i class="bi bi-house"></i> Accueil</a>
    <a href="demande.html"><i class="bi bi-pencil-square"></i> Demander un congé</a>
    <a href="mes_conges.html"><i class="bi bi-calendar"></i> Mes congés</a>
    <a href="historique.html"><i class="bi bi-clock-history"></i> Historique</a>
    <a href="documents.html"><i class="bi bi-file-earmark-text"></i> Documents</a>
</div>

<!-- Content -->
<div class="col-md-10 content">
    <h3>Demande de congé administratif</h3>

    <div class="card card-custom p-4">
    <form id="formConge">

    <div class="mb-3">
    <label class="form-label">Type de congé</label>
    <select class="form-select">
    <option>Formation</option>
    <option>Mission</option>
    <option>Responsabilité syndicale</option>
    </select>
    </div>

    <div class="row">
    <div class="col-md-6 mb-3">
    <label>Date début</label>
    <input type="date" id="dateDebut" class="form-control">
    </div>

    <div class="col-md-6 mb-3">
    <label>Date fin</label>
    <input type="date" id="dateFin" class="form-control">
    </div>
    </div>

    <div class="mb-3">
    <label>Durée</label>
    <input type="text" id="duree" class="form-control" readonly>
    </div>

    <div class="mb-3">
    <label>Motif</label>
    <textarea class="form-control" rows="3"></textarea>
    </div>

    <div class="mb-3">
    <label>Pièce jointe</label>
    <input type="file" class="form-control">
    </div>

    <button type="submit" class="btn btn-primary">Soumettre</button>
    <button type="reset" class="btn btn-secondary">Annuler</button>

    </form>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
    $(document).ready(function(){
        function calculerDuree(){
            let debut = new Date($('#dateDebut').val());
            let fin = new Date($('#dateFin').val());

            if(debut && fin && fin >= debut){
                let diff = (fin - debut) / (1000*60*60*24) + 1;
                $('#duree').val(diff + " jours");
            }
        }

        $('#dateDebut, #dateFin').change(calculerDuree);
    });
    </script>
</div>
